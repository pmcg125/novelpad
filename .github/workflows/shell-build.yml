name: Shell Build

# 构建定制 VS Code 壳：上游源码 → overlay + patches → gulp 构建 → 塞入扩展 → 产物
# 首次构建约 40~60 分钟/平台。只在 shell/ 或扩展变动、手动触发、打 tag 时运行。

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["shell/**", "packages/extension/**", "packages/core/**", ".github/workflows/shell-build.yml"]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台（all / win32 / linux / darwin）"
        default: "all"
      gulpBuild:
        description: "是否执行 gulp 编译（false = 只验证打包链路，很快）"
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.up.outputs.tag }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: 读上游版本
        id: up
        shell: bash
        run: echo "tag=$(cat shell/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: 生成构建矩阵
        id: m
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          # 多行值写 $GITHUB_OUTPUT 必须用 heredoc（key<<EOF ... EOF），
          # 直接用 echo 只有第一行带 key= 前缀，其余行会被判为 "Invalid format"。
          # 这里先把 JSON 压成单行，双保险。
          ALL='[{"name":"windows","os":"windows-2022","gulp":"vscode-win32-x64","out":"VSCode-win32-x64","archive":"zip"},{"name":"linux","os":"ubuntu-latest","gulp":"vscode-linux-x64","out":"VSCode-linux-x64","archive":"tar.gz"},{"name":"macos","os":"macos-latest","gulp":"vscode-darwin-arm64","out":"VSCode-darwin-arm64","archive":"zip"}]'
          case "$PLATFORM" in
            win32|windows) SEL='[{"name":"windows","os":"windows-2022","gulp":"vscode-win32-x64","out":"VSCode-win32-x64","archive":"zip"}]' ;;
            linux)         SEL='[{"name":"linux","os":"ubuntu-latest","gulp":"vscode-linux-x64","out":"VSCode-linux-x64","archive":"tar.gz"}]' ;;
            darwin|macos)  SEL='[{"name":"macos","os":"macos-latest","gulp":"vscode-darwin-arm64","out":"VSCode-darwin-arm64","archive":"zip"}]' ;;
            *)             SEL="$ALL" ;;
          esac
          # 用 node 校验并序列化，避免手工拼串出一个坏 JSON 让后面的矩阵静默为空
          echo "matrix=$(node -e 'process.stdout.write(JSON.stringify({include:JSON.parse(process.argv[1])}))' "$SEL")" >> "$GITHUB_OUTPUT"

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package .vsix
        working-directory: packages/extension
        run: npx @vscode/vsce package --no-dependencies --allow-missing-repository -o ../../novelpad.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: novelpad-vsix
          path: novelpad.vsix
          retention-days: 7

  shell:
    needs: [prepare, build-extension]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # 上游 1.85 用 yarn 1；它会向上找到本仓库根的 packageManager: pnpm 并拒绝执行
      SKIP_YARN_COREPACK_CHECK: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ needs.prepare.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: 应用 overlay 与 patches
        run: node shell/scripts/apply.mjs upstream

      - name: 上游要求的 Node 版本
        id: nvm
        shell: bash
        run: echo "version=$(cat upstream/.nvmrc)" >> "$GITHUB_OUTPUT"

      - name: 检测上游包管理器
        id: pm
        shell: bash
        run: |
          if [ -f upstream/pnpm-lock.yaml ]; then
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lock=upstream/pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f upstream/yarn.lock ]; then
            echo "install=yarn install --frozen-lockfile --network-timeout 600000" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lock=upstream/yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f upstream/package-lock.json ]; then
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lock=upstream/package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "未找到锁文件" >&2
            exit 1
          fi

      # 上游若改用 pnpm，先装对应版本（setup-node 的 pnpm 缓存需要它）
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.cache == 'pnpm'
        with:
          package_json_file: upstream/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.version }}

      # 上游 1.85 的 node-gyp 9.3.1 需要 Python <= 3.11（3.12 起没有 distutils）
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: 安装依赖
        if: inputs.gulpBuild != false
        working-directory: upstream
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm i -g node-gyp@10
          ${{ steps.pm.outputs.install }}

      - name: 构建（gulp ${{ matrix.gulp }}）
        if: inputs.gulpBuild != false
        working-directory: upstream
        shell: bash
        run: npx gulp ${{ matrix.gulp }}

      # 跳过真实编译时（gulpBuild=false），造一个最小目录，只验证 embed + 打包链路
      - name: 造占位产物（仅 gulpBuild=false）
        if: inputs.gulpBuild == false
        shell: bash
        run: |
          mkdir -p "${{ matrix.out }}/resources/app/extensions"
          echo '{"nameShort":"NovelPad","nameLong":"NovelPad","builtInExtensions":[]}' > "${{ matrix.out }}/resources/app/product.json"
          echo '{"name":"code-oss","version":"1.85.0","main":"./out/main.js"}' > "${{ matrix.out }}/resources/app/package.json"

      - name: 定位产物目录
        id: out
        shell: bash
        run: |
          dir="${{ matrix.out }}"
          if [ ! -d "$dir" ]; then
            echo "找不到产物目录 $dir，当前目录内容：" >&2
            ls -la >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "产物：$dir"

      - name: 下载 .vsix
        uses: actions/download-artifact@v4
        with: { name: novelpad-vsix }

      - name: 塞入 NovelPad 扩展
        run: node shell/scripts/embed-extension.mjs "${{ matrix.out }}/resources/app" novelpad.vsix

      - name: 打包
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          out="${{ matrix.out }}"
          base="NovelPad-$tag-${{ matrix.name }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip -mx=1 "$base.zip" "$out" >/dev/null
            else
              zip -qr "$base.zip" "$out"
            fi
          else
            tar -czf "$base.tar.gz" "$out"
          fi
          ls -lh NovelPad-*

      - uses: actions/upload-artifact@v4
        with:
          name: NovelPad-${{ matrix.name }}
          path: NovelPad-*
          retention-days: 30

  patch-check:
    # 补丁可重放性检查：不编译，只 apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 读上游版本
        id: upstream
        shell: bash
        run: echo "tag=$(cat shell/UPSTREAM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream
          fetch-depth: 1
      - run: node shell/scripts/apply.mjs upstream

      # 内置扩展链路：解压与分析完全在纯 JS 里做。
      # 之前用 `tar -xf` 解 vsix，Windows 的 bsdtar 能读 zip，Linux 的 GNU tar 不能，
      # linux job 一律挂在这一步。这段不编译任何东西，秒级，先跑。
      - name: 验证内置扩展链路
        run: node shell/scripts/verify-embed.mjs

      # 皮肤校验：选择器引用未定义的类名 = 运行时静默失效。
      # 上游改版改名时这里先出声，比等用户报告快。
      - name: 检查皮肤选择器
        run: node shell/scripts/check-css.mjs upstream packages/extension/media/workbench.css packages/extension/media/markdown-preview.css

      # configurationDefaults 校验：拼写错误 / 作用域不允许都会被静默丢弃，必须机器验
      - name: 检查 configurationDefaults
        run: node shell/scripts/verify-defaults.mjs upstream packages/extension

      # 字体随包完整性
      - name: 检查字体分片
        run: node shell/scripts/check-fonts.mjs packages/extension/media/fonts

      # 字形覆盖：分片缺字只会静默回退成宋体，必须在 CI 里拦住
      - name: 检查字形覆盖
        run: node shell/scripts/check-font-coverage.mjs packages/extension/media/fonts .

      # 版本管理端到端：真实 git，不 mock。
      # 三个静默缺陷只能这样测出来：子目录路径前缀、快照范围越界、污染作者索引。
      - name: 准备依赖（core dist）
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @novelpad/core build
      - name: 版本管理端到端
        run: node shell/scripts/e2e-version.mjs
