name: Shell Build

# 构建定制 VS Code 壳：上游源码 → overlay + patches → gulp 构建 → 塞入扩展 → 产物
# 首次构建约 40~60 分钟/平台。只在 shell/ 或扩展变动、手动触发、打 tag 时运行。

# 一次壳构建要占三个平台的 runner 近一小时。往 main 连着 push 时，
# 旧运行产出的是过期提交，留着只是占坑，所以让后到的取代先到的。
# group 带 ref：打 tag 触发的运行不会被 main 上的 push 牵连取消。
concurrency:
  group: shell-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["shell/**", "packages/extension/**", "packages/core/**", ".github/workflows/shell-build.yml"]
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台（all / win32 / linux / darwin）"
        default: "all"
      gulpBuild:
        description: "是否执行 gulp 编译（false = 只验证打包链路，很快）"
        type: boolean
        default: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.up.outputs.tag }}
      matrix: ${{ steps.m.outputs.matrix }}
      # 见下面「判断是否执行 gulp」那一步：把「这次要不要真编译」算成明确字符串
      gulp: ${{ steps.g.outputs.gulp }}
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 这次要不要真的跑 gulp。
      #
      # 之前直接写 `if: inputs.gulpBuild != false`，在 push / tag 触发的运行里
      # **是错的**：inputs 在那种事件下不存在，`inputs.gulpBuild` 求值为 null，
      # 而 GitHub 表达式把 `null == false` 判为 true。结果三条闸门同时成立：
      # 「安装依赖」和「构建」被 skipped，「造占位产物」被执行——
      # 每次 push 出来的都是一个几 MB 的空壳，却标记为构建成功。
      # 实测见 run 46032996985：三个平台的 gulp 步骤全是 skipped。
      #
      # 规则：只有手动触发且明确勾掉 gulpBuild 时才走占位。
      # 其它事件（push / tag）一律真编译。
      # ------------------------------------------------------------------
      - name: 判断是否执行 gulp
        id: g
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.gulpBuild }}
        run: |
          # boolean input 转成字符串时大小写不确定（true / False 都出现过），
          # 统一转小写再比。空值 = 非手动触发，按「要真编译」处理。
          want="$(printf '%s' "$WANT" | tr '[:upper:]' '[:lower:]')"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$want" = "false" ]; then
            echo "gulp=false" >> "$GITHUB_OUTPUT"
          else
            echo "gulp=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 读上游版本
        id: up
        shell: bash
        run: echo "tag=$(cat shell/UPSTREAM)" >> "$GITHUB_OUTPUT"

      - name: 生成构建矩阵
        id: m
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          # 多行值写 $GITHUB_OUTPUT 必须用 heredoc（key<<EOF ... EOF），
          # 直接用 echo 只有第一行带 key= 前缀，其余行会被判为 "Invalid format"。
          # 这里先把 JSON 压成单行，双保险。
          #
          # 这期只做 Windows MVP：默认矩阵只保留 windows。linux / macos
          # 的定义留着但收进 case 分支，想手动编它们时
          # workflow_dispatch 传 platform=linux / darwin 就能编，
          # 平时 push / tag 触发不再为另外两个平台各烧一小时 runner。
          ALL='[{"name":"windows","os":"windows-2022","gulp":"vscode-win32-x64","out":"VSCode-win32-x64","archive":"zip"}]'
          case "$PLATFORM" in
            all|"")         SEL="$ALL" ;;
            win32|windows) SEL='[{"name":"windows","os":"windows-2022","gulp":"vscode-win32-x64","out":"VSCode-win32-x64","archive":"zip"}]' ;;
            linux)         SEL='[{"name":"linux","os":"ubuntu-latest","gulp":"vscode-linux-x64","out":"VSCode-linux-x64","archive":"tar.gz"}]' ;;
            darwin|macos)  SEL='[{"name":"macos","os":"macos-latest","gulp":"vscode-darwin-arm64","out":"VSCode-darwin-arm64","archive":"zip"}]' ;;
            *)             SEL="$ALL" ;;
          esac
          # 用 node 校验并序列化，避免手工拼串出一个坏 JSON 让后面的矩阵静默为空
          echo "matrix=$(node -e 'process.stdout.write(JSON.stringify({include:JSON.parse(process.argv[1])}))' "$SEL")" >> "$GITHUB_OUTPUT"

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package .vsix
        working-directory: packages/extension
        run: npx @vscode/vsce package --no-dependencies --allow-missing-repository -o ../../novelpad.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: novelpad-vsix
          path: novelpad.vsix
          retention-days: 7

  shell:
    needs: [prepare, build-extension]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # 上游 1.85 用 yarn 1；它会向上找到本仓库根的 packageManager: pnpm 并拒绝执行
      SKIP_YARN_COREPACK_CHECK: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: 检出上游源码
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ needs.prepare.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: 应用 overlay 与 patches
        run: node shell/scripts/apply.mjs upstream

      - name: 上游要求的 Node 版本
        id: nvm
        shell: bash
        run: echo "version=$(cat upstream/.nvmrc)" >> "$GITHUB_OUTPUT"

      - name: 检测上游包管理器
        id: pm
        shell: bash
        run: |
          if [ -f upstream/pnpm-lock.yaml ]; then
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "cache=pnpm" >> "$GITHUB_OUTPUT"
            echo "lock=upstream/pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f upstream/yarn.lock ]; then
            echo "install=yarn install --frozen-lockfile --network-timeout 600000" >> "$GITHUB_OUTPUT"
            echo "cache=yarn" >> "$GITHUB_OUTPUT"
            echo "lock=upstream/yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f upstream/package-lock.json ]; then
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "cache=npm" >> "$GITHUB_OUTPUT"
            echo "lock=upstream/package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "未找到锁文件" >&2
            exit 1
          fi

      # 上游若改用 pnpm，先装对应版本（setup-node 的 pnpm 缓存需要它）
      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.cache == 'pnpm'
        with:
          package_json_file: upstream/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvm.outputs.version }}

      # 上游 1.85 的 node-gyp 9.3.1 需要 Python <= 3.11（3.12 起没有 distutils）
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: 安装依赖
        if: needs.prepare.outputs.gulp == 'true'
        working-directory: upstream
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm i -g node-gyp@10
          ${{ steps.pm.outputs.install }}

      - name: 构建（gulp ${{ matrix.gulp }}）
        if: needs.prepare.outputs.gulp == 'true'
        working-directory: upstream
        shell: bash
        run: npx gulp ${{ matrix.gulp }}

      # 跳过真实编译时（只在手动勾掉 gulpBuild 时），造一个最小目录，
      # 用来单独验证 embed + 打包链路。条件必须是「等于 false」而不是
      # 「不等于 true」——后者在 push/tag 事件下会成立，等于把占位产物
      # 当成正式构建发出去。
      - name: 造占位产物（仅手动跳过 gulp 时）
        if: needs.prepare.outputs.gulp == 'false'
        shell: bash
        run: |
          mkdir -p "${{ matrix.out }}/resources/app/extensions"
          echo '{"nameShort":"NovelPad","nameLong":"NovelPad","builtInExtensions":[]}' > "${{ matrix.out }}/resources/app/product.json"
          echo '{"name":"code-oss","version":"1.85.0","main":"./out/main.js"}' > "${{ matrix.out }}/resources/app/package.json"

      - name: 定位产物目录
        id: out
        shell: bash
        run: |
          dir="${{ matrix.out }}"
          if [ ! -d "$dir" ]; then
            echo "找不到产物目录 $dir，当前目录内容：" >&2
            ls -la >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "产物：$dir"

      - name: 下载 .vsix
        uses: actions/download-artifact@v4
        with: { name: novelpad-vsix }

      - name: 塞入 NovelPad 扩展
        run: node shell/scripts/embed-extension.mjs "${{ matrix.out }}/resources/app" novelpad.vsix

      # 中文语言包：作者是中文写作者，菜单不该叫 File / Edit。
      # 语言包不进 upstream 源码，所以要在这里单独塞进 resources/app/extensions。
      # 下载带 sha256 校验——包是第三方产物，内容变了必须当场红。
      - name: 取中文语言包
        run: node shell/scripts/fetch-language-pack.mjs .langpack

      - name: 内置中文语言包
        run: |
          node shell/scripts/embed-language-pack.mjs \
            "${{ matrix.out }}/resources/app" \
            .langpack/vscode-language-pack-zh-hans-1.85.0.vsix \
            --locale zh-cn

      # 三件「只能靠真跑发现」的默认值：信任关闭 / 默认中文 / 首启动补
      # languagepacks.json。判据自检也跑一遍，防止守卫自己写错。
      - name: 壳默认值自检判据
        run: node shell/scripts/verify-shell-defaults-selftest.mjs "${{ matrix.out }}/resources/app"

      - name: 检查壳默认值
        run: node shell/scripts/verify-shell-defaults.mjs "${{ matrix.out }}/resources/app"

      - name: 打包
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          out="${{ matrix.out }}"
          base="NovelPad-$tag-${{ matrix.name }}"

          # 解压根直接就是应用根。上游 gulp 产出的目录叫 VSCode-win32-x64，
          # 不管它就打会得到「zip → VSCode-win32-x64/ → NovelPad.exe」：
          #   1) 把微软的名字发给用户，撞商标红线；
          #   2) 用户解压后还得再点一层才看见 exe。
          # 改名 + 从目录内打包，让解压根就是 exe 所在层。
          stage="NovelPad"
          rm -rf "$stage"
          mv "$out" "$stage"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            if command -v 7z >/dev/null 2>&1; then
              ( cd "$stage" && 7z a -tzip -mx=1 "../$base.zip" . >/dev/null )
            else
              ( cd "$stage" && zip -qr "../$base.zip" . )
            fi
          else
            ( cd "$stage" && tar -czf "../$base.tar.gz" . )
          fi
          ls -lh "$base".*

      # 产物自检：体积能骗人，文件清单和 checksums 不能。
      # checksums 对不上 = 用户双击就是「安装损坏」，而 CI 面板依然全绿。
      - name: 产物体检
        if: matrix.archive == 'zip'
        run: node shell/scripts/verify-artifact.mjs "NovelPad-${{ needs.prepare.outputs.tag }}-${{ matrix.name }}.zip" --expect-flat

      - uses: actions/upload-artifact@v4
        with:
          name: NovelPad-${{ matrix.name }}
          path: NovelPad-*
          retention-days: 30

  patch-check:
    # 补丁可重放性检查：不编译，只 apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 读上游版本
        id: upstream
        shell: bash
        run: echo "tag=$(cat shell/UPSTREAM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream
          fetch-depth: 1
      - run: node shell/scripts/apply.mjs upstream

      # 003 的三处默认值：信任关闭 / 默认中文 / 首启动补 languagepacks.json。
      # 单独验一次，因为它的失败方式很隐蔽：apply 能成功，但改错了位置，
      # 只有在真机上才会表现为「界面还是英文」。
      - name: 验证壳默认值补丁
        run: node shell/scripts/verify-patch-003.mjs

      # 内置扩展链路：解压与分析完全在纯 JS 里做。
      # 之前用 `tar -xf` 解 vsix，Windows 的 bsdtar 能读 zip，Linux 的 GNU tar 不能，
      # linux job 一律挂在这一步。这段不编译任何东西，秒级，先跑。
      - name: 验证内置扩展链路
        run: node shell/scripts/verify-embed.mjs

      # 皮肤校验：选择器引用未定义的类名 = 运行时静默失效。
      # 上游改版改名时这里先出声，比等用户报告快。
      - name: 检查皮肤选择器
        run: node shell/scripts/check-css.mjs upstream packages/extension/media/workbench.css packages/extension/media/markdown-preview.css

      # configurationDefaults 校验：拼写错误 / 作用域不允许都会被静默丢弃，必须机器验
      - name: 检查 configurationDefaults
        run: node shell/scripts/verify-defaults.mjs upstream packages/extension

      # 字体随包完整性
      - name: 检查字体分片
        run: node shell/scripts/check-fonts.mjs packages/extension/media/fonts

      # 字形覆盖：分片缺字只会静默回退成宋体，必须在 CI 里拦住
      - name: 检查字形覆盖
        run: node shell/scripts/check-font-coverage.mjs packages/extension/media/fonts .

      # 主题完整性：ThemeColor 取不到色值时上游返回 'transparent'，
      # 也就是那段文字**直接消失**，且不报错。装饰引用的每个色都要在主题里定义。
      - name: 检查主题颜色完整性
        run: node shell/scripts/check-themes.mjs packages/extension

      # 构建闸门：push / tag 事件里没有 inputs，`inputs.gulpBuild != false`
      # 会被 null 的隐式转换判成 true，于是每次 push 都产出空壳却全绿。
      # 这段直接从 workflow 抠 bash 正文跑，改 workflow 不用改这里。
      - name: 检查构建闸门
        run: node shell/scripts/check-gate.mjs

      # 产物体检的判据自检：守卫脚本自己也会写错（初版把 md5 写成 sha1）。
      # 只会报错的守卫比没有守卫更糟——真问题会被淹在噪声里。
      - name: 产物体检判据自检
        run: node shell/scripts/verify-artifact-selftest.mjs

      # 版本管理端到端：真实 git，不 mock。
      # 三个静默缺陷只能这样测出来：子目录路径前缀、快照范围越界、污染作者索引。
      - name: 准备依赖（core dist）
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @novelpad/core build
      - name: 版本管理端到端
        run: node shell/scripts/e2e-version.mjs
