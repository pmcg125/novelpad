name: Track Upstream

# 每月检查上游 VS Code 是否发新版；新版上试应用补丁：
#   成功 → 开 PR 更新 shell/UPSTREAM（合并后自动触发壳构建）
#   失败 → 开 Issue 附冲突详情，等人工重做补丁

on:
  schedule:
    - cron: "0 18 3 * *"   # 每月 3 日（上游一般在月初发版）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: 当前版本
        id: cur
        run: echo "tag=$(cat shell/UPSTREAM)" >> $GITHUB_OUTPUT

      - name: 查询上游最新 stable
        id: latest
        run: |
          tag=$(curl -s https://update.code.visualstudio.com/api/update/win32-x64/stable/latest | jq -r .name)
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "当前 ${{ steps.cur.outputs.tag }} → 最新 $tag"

      - name: 已是最新则跳过
        if: steps.latest.outputs.tag == steps.cur.outputs.tag
        run: echo "已是最新" && exit 0

      - name: 检出新版源码
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ steps.latest.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: 试应用补丁
        id: apply
        continue-on-error: true
        run: node shell/scripts/apply.mjs upstream

      - name: 成功 → 开 PR
        if: steps.apply.outcome == 'success' && steps.latest.outputs.tag != steps.cur.outputs.tag
        run: |
          echo "${{ steps.latest.outputs.tag }}" > shell/UPSTREAM
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b upstream/${{ steps.latest.outputs.tag }}
          git commit -am "chore(shell): 上游 → ${{ steps.latest.outputs.tag }}

补丁在新版上重放无冲突，由 upstream-track 自动创建。合并后将触发壳构建。"
          git push origin HEAD
          gh pr create --title "上游更新：${{ steps.latest.outputs.tag }}" --body "$(cat <<'EOF'
自动创建：补丁在 **${{ steps.latest.outputs.tag }}** 上重放成功。

- [ ] 检查 shell-build 是否通过
- [ ] 合并后发版
EOF
)" --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 失败 → 开 Issue
        if: steps.apply.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.APPLY_LOG ?? '/dev/null', 'utf8').slice(-3000);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `上游 ${{ steps.latest.outputs.tag }}：补丁冲突，需人工合并`,
              labels: ['shell', 'upstream'],
              body: `补丁在 \`${{ steps.latest.outputs.tag }}\` 上重放失败。\n\n请在本地：\n\`\`\`\ngh repo clone microsoft/vscode upstream -- --depth 1 --branch ${{ steps.latest.outputs.tag }}\nnode shell/scripts/apply.mjs upstream   # 看哪个 .patch 冲突\n\`\`\`\n重新生成该补丁后推送。\n\n<details><summary>冲突日志</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`
            });
